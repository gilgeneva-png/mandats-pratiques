# ---------------------------------------------------------------------
#  5. LES MANDATS PRATIQUES — SEMESTRE 6
#  Rempli depuis les PDF officiels et la grille « Semestre 6 ».
#  Consigne par défaut : suivre les tâches partielles du document.
