# =====================================================================
#  BROUILLON — Semestre 6 (printemps 2026-2027)
#  Aperçu : …/mandats-pratiques/?fichier=mandats-S6.yml
#  Les apprentis ne voient PAS ce fichier tant qu'il n'est pas
#  renommé en mandats.yml.
# =====================================================================
#  FICHIER MAÎTRE — Site des mandats pratiques
#  C'est le SEUL fichier à mettre à jour. Tout le site est généré à
#  partir de lui (Gantt, pages MP, compte à rebours, fichiers agenda).
# =====================================================================
#
#  MODE D'EMPLOI (5 règles, c'est tout)
#
#  1. Dates toujours au format AAAA-MM-JJ   ex : 2026-11-13
#  2. Indentation = 2 espaces, jamais de tabulation.
#     L'alignement à gauche définit la structure : ne pas le casser.
#  3. Texte long : écrire  |  après les deux-points, puis le texte
#     en dessous, indenté. Dans ce cas, tout caractère est autorisé.
#  4. Texte court contenant « : » ou « # » → le mettre entre guillemets
#     ex :  titre: "Objectifs SMART : fixer et mesurer"
#  5. Une ligne qui commence par # est un commentaire : ignorée par le site.
#
#  Si une règle est cassée, le site affiche un message avec le numéro
#  de la ligne fautive au lieu de planter silencieusement.
#
#  Mise en forme autorisée dans les textes : **gras**, *italique*,
#  listes avec « - » en début de ligne, liens [texte](https://...)
# =====================================================================


