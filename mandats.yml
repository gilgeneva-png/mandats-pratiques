#  Pour l'instant un seul. Pour ajouter le 2e groupe plus tard :
#  copier le bloc, changer id et nom, puis ajouter ses dates dans
#  chaque MP (voir section 5).
# ---------------------------------------------------------------------
groupes:
  - id: g1
    nom: "Équipe Culture+SP"
    actif: true


