# ---------------------------------------------------------------------
#  6. LA CASE « LEARNINGS »  (modèle commun, affiché sur chaque page MP)
#  Les « learnings_pistes » de chaque MP s'ajoutent à ces questions.
# ---------------------------------------------------------------------
learnings:
  intro: |
    La case Learnings, c'est **ton résumé à toi** : la situation, la
    compétence, ce que tu en retiens. Écris-la comme si tu devais la
    raconter à l'oral, sans tes notes. Si tu ne peux pas la défendre
    en deux minutes, elle n'est pas encore prête.
  questions:
    - "La situation : où, quand, avec qui, quelle tâche ?"
    - "La compétence avec tes mots : qu'est-ce qu'elle veut dire, et à quoi elle sert dans ton métier ?"
    - "Ce que tu as fait concrètement, étape par étape"
    - "Ce que tu en retiens, et ce que tu ferais autrement la prochaine fois"
  regles:
    - "Écrit au « je », avec des noms réels (l'équipe, l'association, l'outil)"
    - "10 à 15 lignes suffisent"
    - "Aucune définition copiée : si tu ne l'expliquerais pas comme ça à l'oral, réécris-la"
